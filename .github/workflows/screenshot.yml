name: Screenshot Simulator

# Takes screenshots of Siri Ai in iOS Simulator via CI.
# Trigger: otomatis setelah Build IPA sukses + manual via workflow_dispatch.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build IPA"]
    types: [completed]
    branches: [main]

jobs:
  screenshot:
    # Hanya jalan kalau Build IPA sukses (atau manual trigger).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project AiAdnan120hz/AiAdnan120hz.xcodeproj \
            -scheme AiAdnan120hz \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath ./DerivedData \
            build 2>&1 | tail -20

      - name: Prepare simulator
        run: |
          set -euo pipefail
          # Shutdown any booted devices first (avoid hang)
          xcrun simctl shutdown all || true
          sleep 3
          SIM=$(xcrun simctl list devices available | grep "iPhone 17" | head -1 | grep -oE '[A-F0-9-]{36}' | head -1 || true)
          if [ -z "$SIM" ]; then
            echo "::error::Simulator 'iPhone 17' tidak ditemukan di runner (transient). Rerun workflow."
            exit 1
          fi
          echo "SIM=$SIM" >> $GITHUB_ENV
          echo "Using simulator: $SIM"
          # Boot with timeout
          xcrun simctl boot "$SIM" || true
          # Wait for boot with timeout (max 90s)
          for i in $(seq 1 18); do
            if xcrun simctl bootstatus "$SIM" 2>&1 | grep -q "booted"; then
              echo "Simulator booted"
              break
            fi
            echo "Waiting for boot... ($i/18)"
            sleep 5
          done
          APP_PATH=$(find ./DerivedData -name "AiAdnan120hz.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::AiAdnan120hz.app tidak ditemukan — build simulator gagal (cek step 'Build for simulator')."
            exit 1
          fi
          echo "APP=$APP_PATH" >> $GITHUB_ENV
          echo "App: $APP_PATH"
          xcrun simctl install "$SIM" "$APP_PATH"

      - name: Launch and screenshot
        timeout-minutes: 5
        run: |
          mkdir -p screenshots
          # Launch app with timeout
          timeout 30 xcrun simctl launch "$SIM" com.adnan120hz.aiadnan120hz || echo "Launch done or timed out"
          sleep 5
          # Screenshot 1: initial state (conversations/history)
          xcrun simctl io "$SIM" screenshot screenshots/01-conversations.png
          echo "Screenshot 1 taken"
          sleep 2
          # Screenshot 2: stability check
          xcrun simctl io "$SIM" screenshot screenshots/02-conversations-2.png
          echo "Screenshot 2 taken"
          ls -lh screenshots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SiriAi-screenshots
          path: screenshots/
