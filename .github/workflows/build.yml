name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Secrets.swift
        env:
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          GEMINI_API_KEY_PREMIUM: ${{ secrets.GEMINI_API_KEY_PREMIUM }}
          REDEEM_SECRET: ${{ secrets.REDEEM_SECRET }}
        run: python3 scripts/generate_secrets.py --strict

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Dikunci ke 26.6 agar konsisten dengan screenshot.yml & konvensi CI
          # (macos-26 + setup-xcode 26.6). 'latest-stable' berisiko narik
          # Xcode major baru secara diam-diam dan memecahkan build.
          xcode-version: '26.6'

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          # pipefail WAJIB: tanpa ini xcodebuild yang gagal (piped ke tee)
          # akan dilaporkan sukses karena exit code diambil dari tee.
          set -o pipefail
          xcodebuild \
            -project AiAdnan120hz/AiAdnan120hz.xcodeproj \
            -scheme AiAdnan120hz \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/SiriAi.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "${{ runner.temp }}/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(ls -d "$GITHUB_WORKSPACE/build/SiriAi.xcarchive/Products/Applications/"*.app | head -1)
          echo "App: $APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/ipa"
          zip -qry "$GITHUB_WORKSPACE/SiriAi-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/SiriAi-unsigned.ipa"

      - name: Upload build log (always, for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiriAi-unsigned.ipa
          path: SiriAi-unsigned.ipa
          if-no-files-found: error
